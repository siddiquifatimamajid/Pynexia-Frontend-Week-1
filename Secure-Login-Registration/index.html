<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login & Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">

            <div class="brand">
                <div class="brand-icon">S</div>
                <span>SECURESPACE</span>
            </div>

            <div class="auth-heading">
                <h1 id="formTitle">Welcome back</h1>
                <p id="formSubtitle">Sign in to continue to your account.</p>
            </div>

            <div class="form-switch">
                <button type="button" class="switch-btn active" id="loginTab">
                    Login
                </button>
                <button type="button" class="switch-btn" id="registerTab">
                    Register
                </button>
            </div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="loginEmail">Email address</label>
                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="name@example.com"
                        autocomplete="email"
                        required
                    >
                    <small class="error-message" id="loginEmailError"></small>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <div class="password-field">
                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" class="toggle-password"
                            data-target="loginPassword">
                            Show
                        </button>
                    </div>
                    <small class="error-message" id="loginPasswordError"></small>
                </div>

                <button type="submit" class="submit-btn">
                    Sign In
                </button>

                <p class="form-message" id="loginMessage" role="status"></p>
            </form>

            <form id="registerForm" class="hidden" novalidate>
                <div class="form-group">
                    <label for="registerName">Full name</label>
                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                    <small class="error-message" id="registerNameError"></small>
                </div>

                <div class="form-group">
                    <label for="registerEmail">Email address</label>
                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="name@example.com"
                        autocomplete="email"
                        required
                    >
                    <small class="error-message" id="registerEmailError"></small>
                </div>

                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <div class="password-field">
                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                        >
                        <button type="button" class="toggle-password"
                            data-target="registerPassword">
                            Show
                        </button>
                    </div>
                    <small class="error-message" id="registerPasswordError"></small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>
                    <div class="password-field">
                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            required
                        >
                        <button type="button" class="toggle-password"
                            data-target="confirmPassword">
                            Show
                        </button>
                    </div>
                    <small class="error-message" id="confirmPasswordError"></small>
                </div>

                <button type="submit" class="submit-btn">
                    Create Account
                </button>

                <p class="form-message" id="registerMessage" role="status"></p>
            </form>

            <p class="auth-footer">
                Your security matters. Your information stays protected.
            </p>

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
